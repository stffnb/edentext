<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- One stem colour for every background: an <img> cannot see the app's theme, and
       an ink stem disappears on the dark chrome. Slate holds 3.5:1 on both ends. -->
  <style>
    .stem { stroke: #4c6c8a; }
    .slate { fill: #4c6c8a; }
    .clay { fill: #d1734f; }
  </style>
  <g transform="translate(-0.667,0.306) scale(0.5556)">
    <g transform="translate(20,4)">
      <line class="stem" x1="10" y1="44" x2="10" y2="6" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(10,32)"><path class="slate" d="M0,0 C6,-10 18,-12 27,-6 C21,4 9,6 0,0 Z"/></g>
      <g transform="translate(10,15)"><path class="clay" d="M0,0 C-6,-10 -18,-12 -27,-6 C-21,4 -9,6 0,0 Z"/></g>
      <circle class="clay" cx="10" cy="6" r="3"/>
    </g>
  </g>
</svg>
