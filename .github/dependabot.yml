# Weekly update PRs, grouped so one PR covers a set that must move together.
# Security updates are opened at once regardless of schedule and cooldown;
# the cooldown keeps freshly published (possibly hijacked) versions out for a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    # svelte-check takes TypeScript 5 and 6 only; lift once its peer range grows.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      editor:
        patterns: ["@tiptap/*", "prosemirror-*"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps-desktop)
    groups:
      desktop:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
