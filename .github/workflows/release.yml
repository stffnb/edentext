# Builds dist/ on a version tag and attaches it to a GitHub release, so serving
# the app needs no Node toolchain: unzip, point a web server at the folder. The
# same build ships as a container image for hosts that run one.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The build stamps package.json's version into the app, so a tag that
      # disagrees would publish an archive naming a version it isn't.
      - run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME" || { echo "$GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: npm ci
      - run: npm run build
      # The Dockerfile builds its own dist/, so it also works outside CI; only its
      # nginx stage is per-platform, so nothing runs emulated. Needs Settings ->
      # Packages set to public once.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      # The archive unpacks as edentext-<tag>/, ready to serve as a web root.
      - run: |
          mv dist "edentext-$GITHUB_REF_NAME"
          zip -qr "edentext-$GITHUB_REF_NAME.zip" "edentext-$GITHUB_REF_NAME"
      # This version's changelog section carries the notes; commit subjects
      # stand in where it has none.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v h="## [${GITHUB_REF_NAME#v}]" 'index($0, h) == 1 { p = 1; next } p && /^## \[/ { exit } p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "edentext-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "edentext-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Unsigned desktop installers from the same dist/, one runner per platform,
  # attached to the release the job above created.
  desktop:
    needs: release
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # Flathub reads the version and date from the metainfo in the tar.gz.
      - if: runner.os == 'Linux'
        run: sed -i "s/@VERSION@/${GITHUB_REF_NAME#v}/g; s/@DATE@/$(date -u +%F)/g" desktop/flatpak/*.metainfo.xml
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Repacked with appimagetool so AppImageUpdate finds the next release and
      # fetches only changed blocks; its static runtime also drops libfuse2.
      - if: runner.os == 'Linux'
        working-directory: desktop/release
        run: |
          sudo apt-get install -y zsync
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          f=$(echo *.AppImage)
          "./$f" --appimage-extract >/dev/null
          rm "$f"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run -u "gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|EdenText-*.AppImage.zsync" squashfs-root "$f"
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" desktop/release/*.{dmg,exe,AppImage,zsync,deb,tar.gz}
