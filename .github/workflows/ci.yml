name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CLAUDE.md is read at every session start; detail belongs in the nested files.
      - run: test "$(wc -l < CLAUDE.md)" -le 120 || { echo "CLAUDE.md over its 120-line budget"; exit 1; }
      # The corpus is gitignored, so a test reading it would name a document and fail here.
      - run: |
          ! git grep -l "render-parity/fixtures" -- src tests ':!tests/render-parity' \
            || { echo "a test reads the gitignored parity corpus"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # LibreOffice is not installed here, so the lo-roundtrip suite self-skips
      # (the lo-roundtrip job below runs that leg).
      - run: npm test

  # The re-save-through-LibreOffice leg, which self-skips everywhere soffice is absent.
  lo-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: npm ci
      - run: npm run test:lo

  # Production build booted in headless Chromium — catches bundling and boot
  # regressions the jsdom suite cannot see.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm run build
      - run: npm run test:smoke
