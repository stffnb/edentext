replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: ghcr.io/stffnb/edentext
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion when empty.
  tag: ""
  # Optional immutable manifest digest, for example sha256:abc123...
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: edentext.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Origins allowed to frame the editor, sent as the CSP frame-ancestors directive, for
# example "'self' https://app.example.com". Empty sends none, so any page may frame it.
frameAncestors: ""

# The collaboration relay: one pod that passes encrypted session frames between the
# browsers in a room (relay/CLAUDE.md). nginx serves it at /relay beside the app; the
# app offers sessions only when that path answers. Rooms live in memory, so one replica.
relay:
  enabled: true
  image:
    repository: ghcr.io/stffnb/edentext-relay
    pullPolicy: IfNotPresent
    # Defaults to the chart's appVersion when empty.
    tag: ""
    digest: ""
  # Clients per room, a reload's second connection included; 0 sets no limit.
  maxPeers: 6
  # Open connections in all and per client address; 0 sets no limit.
  maxConns: 2000
  maxConnsPerIp: 20
  # Behind an ingress controller or load balancer every client reaches nginx from its
  # address: list its networks (CIDRs) so nginx takes the client's from X-Forwarded-For.
  trustedProxies: []
  # Bytes all receivers may hold at the relay together; keep resources.limits.memory above
  # it plus the process itself. A receiver holding 16 MiB for stuckMs is dropped.
  maxBuffered: 268435456
  stuckMs: 30000
  # Origins whose pages may connect, e.g. https://docs.example.org or app://edentext (the
  # desktop app); empty allows every origin. It keeps other web pages out, not other programs.
  allowedOrigins: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
