replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: ghcr.io/stffnb/edentext
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion when empty.
  tag: ""
  # Optional immutable manifest digest, for example sha256:abc123...
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: edentext.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Origins allowed to frame the editor, sent as the CSP frame-ancestors directive, for
# example "'self' https://app.example.com". Empty sends none, so any page may frame it.
frameAncestors: ""

# The collaboration relay: one pod that passes encrypted session frames between the
# browsers in a room (relay/CLAUDE.md). nginx serves it at /relay beside the app; the
# app offers sessions only when that path answers. Rooms live in memory, so one replica.
relay:
  enabled: true
  image:
    repository: ghcr.io/stffnb/edentext-relay
    pullPolicy: IfNotPresent
    # Defaults to the chart's appVersion when empty.
    tag: ""
    digest: ""
  # Clients per room, a reload's second connection included; 0 sets no limit.
  maxPeers: 6
  # Open connections in all and per client address; 0 sets no limit. With the ingress
  # enabled and no trustedProxies the limit per address is off, as all share one address.
  maxConns: 2000
  maxConnsPerIp: 20
  # Upgrades per client address and minute; 0 sets no limit.
  dialsPerMin: 60
  # Behind an ingress controller or load balancer every client reaches nginx from its
  # address: list its networks (CIDRs) so nginx takes the client's from X-Forwarded-For.
  trustedProxies: []
  # Bytes all receivers may hold at the relay together; keep resources.limits.memory above
  # it plus the process itself. A receiver holding 8 MiB for stuckMs is dropped.
  maxBuffered: 268435456
  stuckMs: 30000
  # Origins whose pages may connect, e.g. https://docs.example.org or app://edentext (the
  # desktop app); empty allows every origin. It keeps other web pages out, not other programs.
  allowedOrigins: []
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 512Mi

# Presets for the AI assistant, served as edentext.config.json, which anyone can read: it
# holds addresses and models, never a key. Leave everything unset to serve no file.
ai:
  enabled: true
  # openai (any OpenAI-compatible server) or anthropic.
  provider: openai
  # The API's base URL. Empty with the proxy on means /ai/v1 on this host.
  endpoint: ""
  model: ""
  # The model's context window in tokens; 0 leaves it to the user.
  contextTokens: 0
  # true keeps users from choosing another provider.
  locked: false
  # nginx forwards /ai/ to an existing server the operator runs, adding its key.
  proxy:
    enabled: false
    # Root URL of that server, for example https://api.mistral.ai or http://ollama:11434.
    upstream: ""
    # Secret holding the key; the browser never sees it. Empty sends none.
    apiKeySecret:
      name: ""
      key: api-key

# Presets for dictation: an OpenAI-compatible speech recognition server.
dictation:
  enabled: true
  # The server's address. Empty with the proxy on means /stt/v1 on this host.
  server: ""
  model: ""
  # true keeps users from choosing their own speech server.
  locked: false
  # false takes the browser's own speech recognition off the list of dictation services.
  webSpeech: true
  # nginx forwards /stt/ to an existing speech server the operator runs.
  proxy:
    enabled: false
    upstream: ""
    apiKeySecret:
      name: ""
      key: api-key

nodeSelector: {}
tolerations: []
affinity: {}
