apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edentext.fullname" . }}-nginx
  labels:
    {{- include "edentext.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;

    events {}

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      server_tokens off;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        access_log /dev/stdout;
        error_log /dev/stderr warn;
        {{- if .Values.relay.trustedProxies }}

        # The client's address from the proxy in front, for the relay's limit per address.
        {{- range .Values.relay.trustedProxies }}
        set_real_ip_from {{ . }};
        {{- end }}
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        {{- end }}
        {{- with .Values.frameAncestors }}

        add_header Content-Security-Policy "frame-ancestors {{ . }}" always;
        {{- end }}

        location / {
          try_files $uri $uri/ =404;
        }
        {{- if .Values.relay.enabled }}

        # Collaboration sessions: the WebSocket and its health check go to the relay.
        location /relay {
          proxy_pass http://{{ include "edentext.relayName" . }}:4390;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header X-Real-IP $remote_addr;
          proxy_read_timeout 1h;
          proxy_send_timeout 1h;
        }
        {{- end }}
        {{- with .Values.ai.proxy }}
        {{- if .enabled }}
        {{- $var := ternary "EDENTEXT_AI_KEY" "" (ne .apiKeySecret.name "") }}
        {{- $header := ternary "x-api-key" "Authorization" (eq $.Values.ai.provider "anthropic") }}
        {{- include "edentext.proxyLocation" (dict "path" "/ai/" "upstream" (required "ai.proxy.upstream is required" .upstream) "header" $header "var" $var "timeout" "600s" "body" "64m") | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- with .Values.dictation.proxy }}
        {{- if .enabled }}
        {{- $var := ternary "EDENTEXT_DICTATION_KEY" "" (ne .apiKeySecret.name "") }}
        {{- include "edentext.proxyLocation" (dict "path" "/stt/" "upstream" (required "dictation.proxy.upstream is required" .upstream) "header" "Authorization" "var" $var "timeout" "60s" "body" "16m") | nindent 8 }}
        {{- end }}
        {{- end }}
      }
    }
  {{- with include "edentext.hostConfig" . }}
  edentext.config.json: |
    {{- . | nindent 4 }}
  {{- end }}
